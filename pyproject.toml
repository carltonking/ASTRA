[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-trading-agent"
version = "0.2.0"
description = "Autonomous Self-learning Trading and Research Agent"
requires-python = ">=3.11, <3.14"
dependencies = [
    "anthropic>=0.25.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "alpaca-py>=0.20.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "reportlab>=4.0.0",
    "openai>=1.0.0",
    "scipy>=1.11.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
lseg = ["lseg-data>=1.0.0"]
ibkr = ["ib_insync>=0.9.0"]
# AURORA research-validation engine (CPCV, leakage detection, review board).
# Optional: when installed, AuroraBridge delegates validation to AURORA;
# otherwise it falls back to the built-in BacktestEngine. Activate locally with:
#   uv sync --extra aurora
aurora = ["aurora-trading-research"]
test = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.5.0",
    "pyright>=1.1.370",
]
[dependency-groups]
dev = [
    "aiosqlite>=0.19.0",
    "openai>=1.0.0",
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.5.0",
    "pyright>=1.1.370",
]

[tool.uv.sources]
# Sibling project on disk. Relative to this pyproject.toml.
aurora-trading-research = { path = "../04 - A.U.R.O.R.A", editable = true }

[project.urls]
Homepage = "https://github.com/carltonking/astra-trading-agent"

[project.scripts]
astra = "astra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
